services:
  - type: web
    name: nuel-artist-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/public
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: nuel-artist-api
          envVarKey: RENDER_EXTERNAL_URL
